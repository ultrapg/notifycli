[package]
name = "notifycli"
version = "0.1.0"
edition = "2021"
description = "A lightweight, single-binary cross-platform desktop notification CLI tool"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
notify-rust = "4.11"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
